# /etc/nginx/sites-available/huiyingzhai
# 替换 api.example.com 与证书路径后启用；证书可用 certbot 自动申请

# 部署面板限速：约每秒 2 次，防止暴力猜密码；页面轮询（约 0.8 次/秒）不受影响。
# 这行必须放在 http 上下文（sites-enabled 文件默认就在 http 内）。
limit_req_zone $binary_remote_addr zone=huiyingzhai_deploy:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # 附件最大 20MB，预留 multipart 开销
    client_max_body_size 25m;

    # 附件直接由 Nginx 读取，避免 Node 转发大文件
    location /uploads/ {
        alias /opt/huiyingzhai/server/uploads/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 个人主页（根路径）与网页部署面板（只监听 127.0.0.1:3999）
    location = / {
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 部署页需要登录（账号在服务器上以哈希保存）
    location = /deploy {
        return 301 /deploy/;
    }
    location /deploy/ {
        # 建议进一步限制来源 IP：取消注释并填自己的固定出口 IP
        # allow 203.0.113.10;
        # deny all;

        limit_req zone=huiyingzhai_deploy burst=40 nodelay;
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 项目介绍（公开）
    location = /intro { return 301 /intro/; }
    location /intro/ {
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 使用说明书（公开）
    location = /manual { return 301 /manual/; }
    location /manual/ {
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 我的：登录、改密；项目介绍/使用说明书的编辑接口也在 /me/api 下
    location = /me { return 301 /me/; }
    location /me/ {
        limit_req zone=huiyingzhai_deploy burst=40 nodelay;
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 汇英斋数据上传
    location = /upload { return 301 /upload/; }
    location /upload/ {
        limit_req zone=huiyingzhai_deploy burst=40 nodelay;
        proxy_pass http://127.0.0.1:3999;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 其余路径一律拒绝，避免暴露无关内容
    location / {
        return 404;
    }
}
